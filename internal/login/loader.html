<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>{{LOADING_LABEL}}…</title>
<style>
body{margin:0;background:#0a0e17;color:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
#__cp_ovl__{position:fixed;inset:0;z-index:99999;background:#0a0e17;display:flex;align-items:center;justify-content:center;transition:opacity .3s}
#__cp_box__{display:flex;flex-direction:column;align-items:center;gap:1rem;width:min(280px,70vw)}
#__cp_spin__{width:32px;height:32px;border:3px solid rgba(0,158,255,.2);border-top-color:#009EFF;border-radius:50%;animation:__cp_r__ .6s linear infinite}
@keyframes __cp_r__{to{transform:rotate(360deg)}}
#__cp_bar_w__{width:100%;height:6px;background:rgba(0,158,255,.15);border-radius:3px;overflow:hidden}
#__cp_bar__{height:100%;width:0;background:#009EFF;border-radius:3px;transition:width .2s}
#__cp_lbl__{font-size:.8rem;color:#9ca3af;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="__cp_ovl__"><div id="__cp_box__"><div id="__cp_spin__"></div><div id="__cp_bar_w__"><div id="__cp_bar__"></div></div><div id="__cp_lbl__">{{LOADING_LABEL}}…</div></div></div>
<script>
(function(){
  'use strict';
  var MAGIC=[0x43,0x50,0x47,0x53];
  var VERSION=1;
  var SALT_LEN=16;
  var NONCE_LEN=12;
  var HEADER_LEN=4+1+SALT_LEN+NONCE_LEN;
  var ITERATIONS=100000;
  var STORAGE_KEY='cubbitseal_password';
  var LOADING_LABEL='{{LOADING_LABEL}}';

  var pwd=sessionStorage.getItem(STORAGE_KEY);
  if(!pwd){window.location.href='index.html';return;}

  var encUrl='{{ENC_URL}}';

  function ensureServiceWorker(p){
    if(!('serviceWorker' in navigator)){
      return Promise.resolve(false);
    }
    return navigator.serviceWorker.register('sw.js').then(function(){
      return navigator.serviceWorker.ready;
    }).then(function(reg){
      var sw=reg.active;
      return new Promise(function(resolve){
        var ch=new MessageChannel();
        ch.port1.onmessage=function(ev){
          if(ev.data&&ev.data.type==='PASSWORD_SET') resolve(true);
        };
        sw.postMessage({type:'SET_PASSWORD',password:p},[ch.port2]);
        setTimeout(function(){resolve(true);},2000);
      });
    }).catch(function(){
      return false;
    });
  }

  // Self-contained overlay that polls the service worker for progress.
  // It must be self-contained because document.write() discards this script,
  // while Window timers and the SW survive.
  function buildOverlay(label){
    var style='<style id="__cp_ovl_s__">#__cp_ovl__{position:fixed;inset:0;z-index:99999;background:#0a0e17;display:flex;align-items:center;justify-content:center;transition:opacity .3s}#__cp_box__{display:flex;flex-direction:column;align-items:center;gap:1rem;width:min(280px,70vw)}#__cp_spin__{width:32px;height:32px;border:3px solid rgba(0,158,255,.2);border-top-color:#009EFF;border-radius:50%;animation:__cp_r__ .6s linear infinite}@keyframes __cp_r__{to{transform:rotate(360deg)}}#__cp_bar_w__{width:100%;height:6px;background:rgba(0,158,255,.15);border-radius:3px;overflow:hidden}#__cp_bar__{height:100%;width:0;background:#009EFF;border-radius:3px;transition:width .2s}#__cp_lbl__{font-size:.8rem;color:#9ca3af;font-variant-numeric:tabular-nums}</style>';
    var div='<div id="__cp_ovl__"><div id="__cp_box__"><div id="__cp_spin__"></div><div id="__cp_bar_w__"><div id="__cp_bar__"></div></div><div id="__cp_lbl__">'+label+'…</div></div></div>';
    var script='<script>(function(){'+
      'var LABEL='+JSON.stringify(label)+';'+
      'function fmt(n){if(n<1024)return n+" B";var u=["KB","MB","GB","TB"],i=-1;do{n/=1024;i++;}while(n>=1024&&i<u.length-1);return n.toFixed(1)+" "+u[i];}'+
      'function poll(){var sw=navigator.serviceWorker&&navigator.serviceWorker.controller;if(!sw)return;var ch=new MessageChannel();'+
        'ch.port1.onmessage=function(ev){if(!ev.data||ev.data.type!=="PROGRESS")return;var r=ev.data.received,t=ev.data.total;'+
          'var b=document.getElementById("__cp_bar__"),l=document.getElementById("__cp_lbl__");if(!b||!l)return;'+
          'if(t>0){b.style.width=Math.min(100,Math.round(r/t*100))+"%";l.textContent=LABEL+" "+fmt(r)+" / "+fmt(t);}};'+
        'sw.postMessage({type:"GET_PROGRESS"},[ch.port2]);}'+
      'var timer=setInterval(poll,300);poll();'+
      'function rm(){if(timer){clearInterval(timer);timer=null;}var o=document.getElementById("__cp_ovl__");if(o){o.style.opacity="0";setTimeout(function(){o.parentNode&&o.parentNode.removeChild(o);},300);}}'+
      'if(document.readyState==="complete"){rm();}else{window.addEventListener("load",rm);}'+
    '})();<\/script>';
    return {style:style,div:div,script:script};
  }

  function injectLoadingOverlay(html){
    var o=buildOverlay(LOADING_LABEL);
    html=html.replace(/(<head[^>]*>)/i,function(m){return m+o.style;});
    html=html.replace(/(<body[^>]*>)/i,function(m){return m+o.div;});
    html=html.replace(/<\/body>/i,o.script+'</body>');
    return html;
  }

  function reportBytes(key,n){
    var sw=navigator.serviceWorker&&navigator.serviceWorker.controller;
    if(sw)sw.postMessage({type:'ADD_BYTES',key:key,bytes:n});
  }

  function loadEncryptedDirect(){
    return fetch(encUrl).then(function(r){
      if(!r.ok)throw new Error('fetch failed');
      return r.arrayBuffer();
    }).then(function(buf){
      reportBytes(encUrl,buf.byteLength);
      return decryptData(new Uint8Array(buf),pwd);
    }).then(function(plain){
      var html=injectLoadingOverlay(new TextDecoder().decode(plain));
      document.open();
      document.write(html);
      document.close();
    });
  }

  function decryptData(data,password){
    if(data.length<HEADER_LEN)return Promise.reject('too short');
    for(var i=0;i<4;i++){if(data[i]!==MAGIC[i])return Promise.reject('bad magic');}
    if(data[4]!==VERSION)return Promise.reject('bad version');
    var off=5;
    var salt=data.slice(off,off+SALT_LEN);off+=SALT_LEN;
    var nonce=data.slice(off,off+NONCE_LEN);off+=NONCE_LEN;
    var ct=data.slice(off);
    return deriveKey(password,salt).then(function(key){
      return crypto.subtle.decrypt({name:'AES-GCM',iv:nonce,tagLength:128},key,ct);
    });
  }

  function deriveKey(password,salt){
    var enc=new TextEncoder();
    return crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']).then(function(km){
      return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:ITERATIONS,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    });
  }

  // --- Main: register SW (so asset fetches are decrypted) then load the page ---
  // Always fetch the .enc file directly: the service worker never intercepts
  // ".enc" requests, so this cannot loop back to this loader page. Fetching the
  // plain URL instead would be served this loader HTML itself by the SW.
  ensureServiceWorker(pwd).then(function(){
    return loadEncryptedDirect();
  }).catch(function(){
    sessionStorage.removeItem(STORAGE_KEY);
    if(navigator.serviceWorker&&navigator.serviceWorker.controller){
      navigator.serviceWorker.controller.postMessage({type:'CLEAR_PASSWORD'});
    }
    window.location.href='index.html';
  });
})();
</script>
</body>
</html>
